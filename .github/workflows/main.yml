name: Generate Examples Catalog

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Indexer Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ORG: "HTH-Test-org" 
        run: python generate_index.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add examples.json
          
          if git diff --staged --quiet; then
            echo "No changes in examples.json. Skipping commit."
          else
            git commit -m "chore: auto-update examples catalog"
            git push origin HEAD:main
            echo "Catalog successfully updated and pushed!"
          fi
